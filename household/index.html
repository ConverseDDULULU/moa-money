<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>모아 가계부</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 통장(passbook) 느낌 — 상단 고정 바 + 탭, 1120px 본문, 큰 숫자는 명조, 금액 열은 고정폭 숫자 */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --sunk:#E9EBF1; --ink:#161A26; --ink-2:#4A5164; --ink-3:#787F92;
  --line:#DADDE6; --line-2:#BEC3D0;
  --accent:#2747C4; --accent-ink:#FFFFFF; --accent-soft:#E3E8FA; --bar:#3456D1;
  --c-bank:#3456D1; --c-sav:#14947D; --c-stock:#D9822B; --c-other:#8E94A6;
  --up:#D2302A; --down:#2459D0;
  --ok:#1C7A4C; --ok-soft:#E1F2E8; --warn:#9A5B00; --warn-soft:#FBEFD8; --crit:#B4231A; --crit-soft:#FBE5E2;
  --f-display:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1118; --surface:#171A24; --sunk:#1F2330; --ink:#E6E8EF; --ink-2:#A9AFC0; --ink-3:#7E8598;
  --line:#2A2F3D; --line-2:#3C4254;
  --accent:#7D96F0; --accent-ink:#0C1330; --accent-soft:#1F2850; --bar:#6482E8;
  --c-bank:#6482E8; --c-sav:#25A88F; --c-stock:#C97E35; --c-other:#6C7286;
  --up:#F2706A; --down:#6E9BF5;
  --ok:#5CCB8D; --ok-soft:#173424; --warn:#E5AE52; --warn-soft:#3A2C12; --crit:#F2766B; --crit-soft:#3D1A17;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1118; --surface:#171A24; --sunk:#1F2330; --ink:#E6E8EF; --ink-2:#A9AFC0; --ink-3:#7E8598;
  --line:#2A2F3D; --line-2:#3C4254;
  --accent:#7D96F0; --accent-ink:#0C1330; --accent-soft:#1F2850; --bar:#6482E8;
  --c-bank:#6482E8; --c-sav:#25A88F; --c-stock:#C97E35; --c-other:#6C7286;
  --up:#F2706A; --down:#6E9BF5;
  --ok:#5CCB8D; --ok-soft:#173424; --warn:#E5AE52; --warn-soft:#3A2C12; --crit:#F2766B; --crit-soft:#3D1A17;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:700;font-size:27px;letter-spacing:-.01em;line-height:1.3}
h2{font-size:15px;font-weight:700}
p{margin:0}
.meta{color:var(--ink-3);font-size:12.5px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:12px 6px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:700;font-size:20px;white-space:nowrap}
.coin{width:24px;height:24px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;font:700 12px/1 var(--f-body);color:var(--accent)}
.who{color:var(--ink-2);display:flex;align-items:center;gap:8px}
.bar-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
.mon{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:6px;padding:9px 12px 10px;border-bottom:2px solid transparent;color:var(--ink-2);text-decoration:none;white-space:nowrap;font-weight:500}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-color:var(--accent);font-weight:700}

main.wrap{padding-block:22px 80px}
.view{display:grid;gap:16px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 18px;flex-wrap:wrap}
.page-head .meta{margin-top:4px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0;scroll-margin-top:130px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin-bottom:12px}
.card-head h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.grid-wide{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:grid;gap:16px;align-content:start}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.sm{padding:4px 10px;font-size:12.5px}
.link-btn{background:none;border:0;padding:0;font:inherit;font-size:12.5px;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.link-btn.danger{color:var(--crit)}
:where(button,a,select,input,summary,label.btn):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:6px 10px;min-width:0;max-width:100%}
input[type="checkbox"]{width:16px;height:16px;accent-color:var(--accent)}
textarea{display:block;width:100%;min-height:120px;resize:vertical;font:13px/1.55 var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:10px 12px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;padding:2px;background:var(--sunk)}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;font:inherit;font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgb(0 0 0 / .1)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700;line-height:1.65;white-space:nowrap;border:0;font-family:var(--f-body)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.muted{background:var(--sunk);color:var(--ink-2)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
button.chip{cursor:pointer}
.src{display:block;font-size:11.5px;color:var(--ink-3)}
.note{padding:10px 14px;border-radius:var(--r);background:var(--sunk);color:var(--ink-2);font-size:13px}
.note.warn{background:var(--warn-soft);color:var(--ink)}
.up{color:var(--up)} .down{color:var(--down)} .pos{color:var(--accent)} .neg{color:var(--crit)}

.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;font-weight:700;color:var(--ink-2);font-size:12px;padding:7px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
th.num,td.num{text-align:right}
tfoot td{font-weight:700;border-top:1px solid var(--ink-3);border-bottom:0}
td input{padding:4px 8px;font-size:12.5px;width:110px;text-align:right;font-family:var(--f-num)}

.big{font-family:var(--f-display);font-size:38px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.lab{font-size:12.5px;color:var(--ink-2)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px 28px;align-items:center}
.mix{display:grid;gap:10px}
.mixbar{display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.mixbar span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.lg{display:grid;gap:1px;font-size:12.5px;color:var(--ink-2)}
.lg b{font-family:var(--f-num);font-weight:500;color:var(--ink);font-size:13.5px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.kpi .lab{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi .val{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.35;margin-top:2px}
.kpi .sub{font-size:12.5px;color:var(--ink-3)}

.comp{display:grid;gap:2px}
.crow{display:grid;grid-template-columns:minmax(76px,112px) minmax(40px,1fr) auto 38px;gap:10px;align-items:center;width:100%;padding:6px 8px;border-radius:6px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.crow:hover{background:var(--sunk)}
.crow[aria-pressed="true"]{background:var(--accent-soft)}
.cname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctrack{height:10px;display:block}
.cbar{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.cval{text-align:right;font-size:12.5px} .cpct{text-align:right;color:var(--ink-3);font-size:12px}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-top:8px}
.meter span{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0}
.meter.over span{background:var(--crit)}

.ins{display:grid;gap:0}
.in-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.in-row:first-child{border-top:0;padding-top:2px}
.in-row .t{font-weight:700;font-size:13.5px}
.in-row .d{grid-column:2;font-size:12.5px;color:var(--ink-2)}
.list{display:grid}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.li .acts{grid-column:2 / -1;display:flex;gap:10px;justify-content:flex-end}
.dayh{display:flex;justify-content:space-between;gap:8px;padding:12px 0 4px;font-size:12.5px;color:var(--ink-2);font-weight:700;border-bottom:1px solid var(--line-2)}
.dayh:first-child{padding-top:0}
.cal-d{font-family:var(--f-num);font-size:12.5px;color:var(--ink-2);min-width:40px}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px;align-items:end}
.form label{display:grid;gap:3px;font-size:12px;color:var(--ink-2)}
.form .wide{grid-column:span 2}
.form .chkl{display:flex;align-items:center;gap:8px;font-size:13px;padding-bottom:7px}
.form-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;grid-column:1 / -1}
.sav{display:grid;gap:10px;padding:16px 0;border-top:1px solid var(--line)}
.sav:first-of-type{border-top:0;padding-top:4px}
.sav-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sav-top .r{margin-left:auto}
.sav-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 14px}
.kv{display:grid;gap:1px;font-size:12px;color:var(--ink-3)}
.kv b{font-family:var(--f-num);font-weight:500;color:var(--ink);font-size:13.5px}
.taxrows{display:grid;gap:0;font-size:13.5px}
.taxrows div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.taxrows div.total{border-bottom:0;border-top:2px solid var(--ink-3);font-weight:700;font-size:15px;padding-top:10px}
.preview{display:grid;gap:8px;padding:14px;border:1px dashed var(--line-2);border-radius:var(--r)}
.confirm{display:grid;gap:10px;padding:12px;border-radius:var(--r);background:var(--crit-soft);margin-top:12px}
.empty{display:grid;gap:10px;justify-items:start;padding:26px 22px}
.empty p{max-width:60ch;color:var(--ink-2)}
.help{font-size:13px;color:var(--ink-2)} .help summary{cursor:pointer;color:var(--accent);font-weight:500} .help ul{margin:8px 0;padding-left:18px;display:grid;gap:4px}
.card > p + p,.card > h2 + p{margin-top:8px}

#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1}

@media (max-width:900px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .grid-wide{grid-template-columns:1fr} .sav-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:760px){ .grid2,.hero{grid-template-columns:1fr} }
@media (max-width:520px){
  h1{font-size:23px} .big{font-size:32px} .kpi .val{font-size:21px}
  .kpis{grid-template-columns:1fr 1fr}
  .legend{grid-template-columns:1fr 1fr}
  .crow{grid-template-columns:minmax(0,1fr) auto 34px;row-gap:4px} .crow .ctrack{grid-column:1 / -1;grid-row:2}
  .form .wide{grid-column:auto}
  .bar-tools{margin-left:0;width:100%}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;scroll-behavior:auto!important} }
</style>

<header class="bar">
  <div class="wrap">
    <div class="bar-row">
      <div class="brand"><span class="coin" aria-hidden="true">₩</span>모아 가계부</div>
      <div class="who" id="who"></div>
      <div class="bar-tools">
        <div class="seg" role="group" aria-label="볼 데이터 고르기">
          <button type="button" data-ws="sample" aria-pressed="true">예시 가계부</button>
          <button type="button" data-ws="mine" aria-pressed="false">내 가계부</button>
        </div>
        <label class="mon" for="month">달 <select id="month"></select></label>
      </div>
    </div>
    <nav class="tabs" aria-label="화면">
      <a class="tab" href="#home" data-v="home">한눈에</a>
      <a class="tab" href="#ledger" data-v="ledger">가계부</a>
      <a class="tab" href="#fixed" data-v="fixed">고정비</a>
      <a class="tab" href="#savings" data-v="savings">예적금 · 통장</a>
      <a class="tab" href="#stocks" data-v="stocks">주식 · 양도세</a>
      <a class="tab" href="#data" data-v="data">설정 · 데이터</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-home"></section>
  <section class="view" id="v-ledger" hidden></section>
  <section class="view" id="v-fixed" hidden></section>
  <section class="view" id="v-savings" hidden></section>
  <section class="view" id="v-stocks" hidden></section>
  <section class="view" id="v-data" hidden></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
'use strict';
/* ───────── 도구 ───────── */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const p2 = n => String(n).padStart(2, '0');
const won = n => Math.round(n || 0).toLocaleString('ko-KR');
const sum = (a, k) => a.reduce((s, x) => s + (Number(typeof k === 'function' ? k(x) : x[k]) || 0), 0);
const byDate = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const hasX = () => typeof XLSX !== 'undefined';
const floor10 = n => Math.floor(n / 10) * 10;
const K = k => 'moa.v1.' + k;
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
function man(n) {
  const neg = n < 0; n = Math.abs(Math.round(n || 0)); let s;
  if (n >= 1e8) { let e = Math.floor(n / 1e8), m = Math.round((n % 1e8) / 1e4); if (m === 10000) { e++; m = 0; } s = e + '억' + (m ? ' ' + m.toLocaleString('ko-KR') + '만' : ''); }
  else if (n >= 1e4) { const m = Math.floor(n / 1e4), r = Math.round((n % 1e4) / 100) * 100; s = m.toLocaleString('ko-KR') + '만' + (r && n < 1e6 ? ' ' + (r >= 10000 ? '' : r.toLocaleString('ko-KR')) : ''); }
  else s = n.toLocaleString('ko-KR');
  return (neg ? '−' : '') + s + '원';
}
const signWon = (n, plus = '+') => (n > 0 ? plus : n < 0 ? '−' : '') + won(Math.abs(n)) + '원';
function parseAmt(v) { if (typeof v === 'number') return v; const n = Number(String(v ?? '').replace(/[^\d.\-]/g, '')); return isFinite(n) ? n : 0; }
const DOWK = ['일', '월', '화', '수', '목', '금', '토'];
const D = {
  parse: s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); },
  fmt: t => new Date(t).toISOString().slice(0, 10),
  add: (s, n) => D.fmt(D.parse(s) + n * 864e5),
  dow: s => new Date(D.parse(s)).getUTCDay(),
  diff: (a, b) => Math.round((D.parse(a) - D.parse(b)) / 864e5),
  lastDay: ym => { const [y, m] = ym.split('-').map(Number); return D.fmt(Date.UTC(y, m, 0)); }
};
const nextYM = ym => { let [y, m] = ym.split('-').map(Number); m++; if (m > 12) { m = 1; y++; } return y + '-' + p2(m); };
const prevYM = ym => { let [y, m] = ym.split('-').map(Number); m--; if (m < 1) { m = 12; y--; } return y + '-' + p2(m); };
const clampDay = (ym, d) => `${ym}-${p2(Math.max(1, Math.min(Number(d) || 1, Number(D.lastDay(ym).slice(8)))))}`;
function addMonths(s, k) { const [y, m, d] = s.split('-').map(Number); let mm = m - 1 + k; const yy = y + Math.floor(mm / 12); mm = ((mm % 12) + 12) % 12; return clampDay(`${yy}-${p2(mm + 1)}`, d); }

  if (!hasX()) { toast('엑셀 도구를 불러오지 못했어요. 새로고침해 주세요'); return; }
  const b = book(), y = S.taxYear || Number(today().slice(0, 4)), tx = taxFor(b.realized, y);
  if (!tx.r.length) { toast(`${y}년에는 판 기록이 없어요`); return; }
  const aoa = [[`${y}년 주식 매도 내역 (${S.d.settings.costMethod === 'fifo' ? '선입선출법' : '이동평균법'})`], [], ['매도일', '종목', '코드', '시장', '수량', '양도가액(원)', '취득가액(원)', '양도차익(원)', '증권거래세 추정(원)']];
  for (const r of tx.r) aoa.push([r.date, r.name, S.d.trades.find(t => t.id === r.id)?.ticker || '', MKT[r.market]?.l || '', r.qty, Math.round(r.proceeds), Math.round(r.basis), Math.round(r.gain), r.stt]);
  aoa.push([], ['해외주식 손익 통산', '', '', '', '', '', '', Math.round(tx.net)], ['기본공제', '', '', '', '', '', '', -tx.ded], ['과세표준', '', '', '', '', '', '', tx.base], ['양도소득세 20%', '', '', '', '', '', '', tx.cgt], ['지방소득세', '', '', '', '', '', '', tx.local], ['합계', '', '', '', '', '', '', tx.total]);
  saveFile(`주식양도세_${y}.xlsx`, xlsxBuf('양도세', aoa, [11, 18, 9, 18, 6, 14, 14, 14, 14]));
}
function doBackup() { const d = S.ws === 'mine' ? S.d : (LS.get(K('mine'), null) || emptyMine()); saveFile(`모아가계부_백업_${today()}.json`, JSON.stringify({ app: 'moa-household', v: 1, savedAt: today(), data: d })); }
async function doRestore(f) {
  try { const o = JSON.parse(await f.text()), d = o && o.data; if (o.app !== 'moa-household' || !d || !Array.isArray(d.tx) || !Array.isArray(d.trades)) throw 0; LS.set(K('mine'), d); loadWS('mine'); toast('백업을 불러왔어요'); render(); }
  catch { toast('모아 가계부 백업 파일이 아니에요'); }
}

/* ───────── 환율 (Frankfurter · 유럽중앙은행 고시, 키 없음) ───────── */
const IN_CLAUDE = !!(window.claude && window.claude.use);
const FX_API = 'https://api.frankfurter.dev/v1/';
let fxBusy = false;
async function fetchFx(date) {
  const r = await fetch(`${FX_API}${date}?base=USD&symbols=KRW`);
  if (!r.ok) throw new Error('http ' + r.status);
  const j = await r.json(), v = Number(j && j.rates && j.rates.KRW);
  if (!(v > 0)) throw new Error('no rate');
  return { rate: Math.round(v * 100) / 100, date: j.date };
}
async function refreshFx(silent) {
  if (IN_CLAUDE || fxBusy) return;
  fxBusy = true; if (!silent && S.tab === 'stocks') render();
  try {
    const { rate, date } = await fetchFx('latest');
    Object.assign(S.d.settings, { fx: rate, fxAt: date, fxSource: 'auto', fxChecked: today() }); save();
    if (!silent) toast(`1달러 = ${rate.toLocaleString('ko-KR')}원 (${date} 기준)`);
  } catch { if (!silent) toast('환율을 불러오지 못했어요. 인터넷 연결을 확인하거나 직접 넣어 주세요'); }
  finally { fxBusy = false; render(); }
}
function maybeAutoFx() { const s = S.d.settings; if (!IN_CLAUDE && s.fxSource !== 'manual' && s.fxChecked !== today()) refreshFx(true); }
async function fillTradeFx() {
  const d = $('#tr-date')?.value, box = $('#tr-fx'); if (!d || !box) return;
  if ($('#tr-market')?.value !== 'US') { toast('해외 주식·ETF일 때만 환율이 필요해요'); return; }
  if (d > today()) { toast('미래 날짜의 환율은 없어요'); return; }
  try { const { rate, date } = await fetchFx(d); box.value = rate; toast(date === d ? `${d} 환율 ${rate.toLocaleString('ko-KR')}원을 넣었어요` : `${d}에는 고시가 없어서 ${date} 환율 ${rate.toLocaleString('ko-KR')}원을 넣었어요`); }
  catch { toast('그날 환율을 불러오지 못했어요. 직접 넣어 주세요'); }
}
function fxNote() {
  const s = S.d.settings;
  if (IN_CLAUDE) return '환율 자동 불러오기는 GitHub 웹사이트 버전에서 쓸 수 있어요.';
  if (s.fxSource === 'manual') return "직접 넣은 환율이에요. '오늘 환율'을 누르면 다시 매일 자동으로 바꿔요.";
  if (s.fxAt) return `환율은 ${s.fxAt} 유럽중앙은행 고시 기준이라 은행 매매기준율과 조금 다를 수 있어요. 양도세 신고에는 증권사 거래내역에 찍힌 환율을 쓰세요.`;
  return '';
}

/* ───────── 저장 폼 ───────── */
const FORMS = {
  tx(v) {
    const amount = parseAmt(v.amount); if (!v.date || !v.memo.trim() || !(amount > 0)) return '날짜, 내용, 금액을 넣어 주세요';
    const o = { date: v.date, type: v.type, cat: v.cat || guessCat(v.memo, v.type), memo: v.memo.trim(), amount, method: v.method.trim() };
    upsert('tx', v.id, o); S.txType = v.type; S.d.tx.sort(byDate); if (!v.date.startsWith(S.month)) S.month = v.date.slice(0, 7);
    return v.id ? '고쳤어요' : `${TYPE_L[o.type]} ${won(amount)}원을 기록했어요`;
  },
  fixed(v) {
    const amount = parseAmt(v.amount), day = Number(v.day); if (!v.name.trim() || !(amount > 0) || !(day >= 1 && day <= 31)) return '이름, 금액, 날짜를 넣어 주세요';
    upsert('fixed', v.id, { name: v.name.trim(), cat: v.cat, amount, cycle: v.cycle, day, month: Number(v.month) || 1, method: v.method.trim(), kind: v.cat === '저축·투자' ? 'save' : 'cost' });
    return v.id ? '고쳤어요' : '고정비를 넣었어요';
  },
  sav(v) {
    const amount = parseAmt(v.amount), rate = parseFloat(v.rate), months = Number(v.months); if (!v.name.trim() || !(amount > 0) || !(rate >= 0) || !(months > 0) || !v.start) return '이름, 금액, 이율, 기간, 가입일을 넣어 주세요';
    upsert('savings', v.id, { kind: v.kind, name: v.name.trim(), bank: v.bank.trim(), amount, rate, months, start: v.start, tax: v.tax, taxRate: parseFloat(v.taxRate) || 0, compound: v.compound === 'on' });
    return v.id ? '고쳤어요' : '예적금을 넣었어요';
  },
  acct(v) {
    const balance = parseAmt(v.balance); if (!v.name.trim()) return '이름을 넣어 주세요';
    upsert('accounts', v.id, { kind: v.kind, name: v.name.trim(), balance, rate: parseFloat(v.rate) || 0, spend: v.spend === 'on' && v.kind === 'bank', at: today() });
    return v.id ? '고쳤어요' : '넣었어요';
  },
  trade(v) {
    const qty = parseFloat(String(v.qty).replace(/,/g, '')), price = parseFloat(String(v.price).replace(/,/g, '')), fee = parseFloat(String(v.fee).replace(/,/g, '')) || 0, fx = parseFloat(String(v.fx).replace(/,/g, '')) || 0;
    if (!v.date || !v.name.trim() || !(qty > 0) || !(price > 0)) return '거래일, 종목, 수량, 가격을 넣어 주세요';
    if (MKT[v.market].cur !== 'KRW' && !(fx > 0)) return '해외주식은 거래한 날 환율을 넣어 주세요';
    upsert('trades', v.id, { date: v.date, market: v.market, name: v.name.trim(), ticker: v.ticker.trim().toUpperCase(), side: v.side, qty, price, fee, fx: MKT[v.market].cur === 'KRW' ? 1 : fx });
    return v.id ? '고쳤어요' : '거래를 넣었어요';
  },
  profile(v) {
    Object.assign(S.d.profile, { name: v.name.trim(), payday: Math.min(31, Math.max(1, Number(v.payday) || 25)), income: parseAmt(v.income), budget: parseAmt(v.budget) });
    return '저장했어요';
  },
  sim(v) { S.simKey = v.key; S.simQty = v.qty; return null; }
};
const COLL = { tx: 'tx', fixed: 'fixed', sav: 'savings', acct: 'accounts', trade: 'trades' };
function upsert(coll, id, obj) { const arr = S.d[coll]; if (id) { const i = arr.findIndex(x => x.id === id); if (i >= 0) { arr[i] = { ...arr[i], ...obj }; return; } } arr.push({ id: uid(coll[0]), ...obj }); }

/* ───────── 그리기 · 이벤트 ───────── */
const VIEWS = ['home', 'ledger', 'fixed', 'savings', 'stocks', 'data'];
let tT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tT); tT = setTimeout(() => t.classList.remove('show'), 2800); }
function renderBar() {
  $('#who').innerHTML = S.ws === 'sample' ? '<span class="chip muted">예시 데이터</span>' : (S.d.profile.name ? `${esc(S.d.profile.name)}님의 가계부` : '내 가계부');
  for (const b of document.querySelectorAll('.bar [data-ws]')) b.setAttribute('aria-pressed', String(b.dataset.ws === S.ws));
  const ms = months(); if (!ms.includes(S.month)) S.month = ms[ms.length - 1];
  $('#month').innerHTML = ms.slice().reverse().map(m => `<option value="${m}"${m === S.month ? ' selected' : ''}>${fmtYM(m)}</option>`).join('');
  for (const a of document.querySelectorAll('.tab')) { if (a.dataset.v === S.tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); }
}
function render() {
  renderBar();
  for (const v of VIEWS) $('#v-' + v).hidden = v !== S.tab;
  ({ home: vHome, ledger: vLedger, fixed: vFixed, savings: vSavings, stocks: vStocks, data: vData })[S.tab]();
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.del) {
    if (S.armed !== b.dataset.del) { S.armed = b.dataset.del; render(); return; }
    const [kind, id] = b.dataset.del.split(':'), coll = COLL[kind], arr = S.d[coll], i = arr.findIndex(x => x.id === id);
    if (i >= 0) arr.splice(i, 1); S.armed = null; if (S.edit?.obj?.id === id) S.edit = null; save(); toast('지웠어요'); render(); return;
  }
  if (S.armed) S.armed = null;
  if (b.dataset.ws) { if (b.dataset.ws !== S.ws) { loadWS(b.dataset.ws); maybeAutoFx(); if (S.ws === 'mine' && !S.d.tx.length && !S.d.accounts.length) { S.tab = 'data'; location.hash = 'data'; } render(); toast(S.ws === 'sample' ? '예시 가계부를 보고 있어요' : '내 가계부를 보고 있어요'); } return; }
  if (b.dataset.edit) { const [kind, id] = b.dataset.edit.split(':'), obj = S.d[COLL[kind]].find(x => x.id === id); if (obj) { S.edit = { kind, obj }; render(); document.querySelector(`form[data-form="${kind}"]`)?.closest('.card')?.scrollIntoView({ block: 'start' }); } return; }
  if (b.dataset.led !== undefined) { S.ledFilter = S.ledFilter === b.dataset.led ? null : b.dataset.led; if (S.tab !== 'ledger') { S.tab = 'ledger'; location.hash = 'ledger'; } render(); return; }
  if (b.dataset.method) { S.d.settings.costMethod = b.dataset.method; save(); render(); toast(b.dataset.method === 'fifo' ? '선입선출법으로 계산해요' : '이동평균법으로 계산해요'); return; }
  const acts = {
    'cancel-edit': () => { S.edit = null; render(); }, 'clear-led': () => { S.ledFilter = null; render(); },
    'dl-ledger': dlLedger, 'dl-tax': dlTax, backup: doBackup, 'fx-latest': () => refreshFx(false), 'fx-trade': fillTradeFx,
    'sms-read': () => { S.smsText = $('#sms-text')?.value || ''; if (!S.smsText.trim()) { toast('문자를 먼저 붙여넣어 주세요'); return; } S.sms = readSms(S.smsText); render(); $('#sms-card')?.scrollIntoView({ block: 'start' }); },
    'sms-example': () => { S.smsText = SMS_EXAMPLE; S.sms = null; render(); },
    'sms-clear': () => { S.smsText = ''; S.sms = null; render(); },
    'sms-cancel': () => { S.sms = null; render(); },
    'sms-commit': commitSms,
    'up-commit': commitUpload, 'up-cancel': () => { S.upload = null; render(); },
    clear: () => { S.confirmClear = true; render(); }, 'clear-no': () => { S.confirmClear = false; render(); },
    'clear-yes': () => { LS.del(K('mine')); S.confirmClear = false; if (S.ws === 'mine') loadWS('mine'); toast('내 가계부를 지웠어요'); render(); }
  };
  if (acts[b.dataset.act]) { acts[b.dataset.act](); return; }
  if (S.armed === null && b.closest('.view')) {/* no-op */ }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const v = Object.fromEntries(new FormData(f)), kind = f.dataset.form, msg = FORMS[kind](v);
  if (msg && /넣어 주세요$/.test(msg)) { toast(msg); return; }
  if (kind !== 'sim') { S.edit = null; save(); }
  if (msg) toast(msg); render();
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'month') { S.month = t.value; S.ledFilter = null; render(); }
  else if (t.id === 'tx-type') { $('#tx-cat').innerHTML = catOpts(t.value, null, !editing('tx')); S.txType = t.value; }
  else if (t.id === 'tax-year') { S.taxYear = Number(t.value); render(); }
  else if (t.dataset.smscat) { const it = S.sms && S.sms[Number(t.dataset.smscat)]; if (it) it.cat = t.value; }
  else if (t.id === 'fx-now') { Object.assign(S.d.settings, { fx: parseFloat(t.value.replace(/,/g, '')) || 0, fxSource: 'manual', fxAt: null }); save(); render(); toast('환율을 직접 넣었어요. 자동 갱신은 멈춰요'); }
  else if (t.dataset.price) { const v = parseFloat(t.value.replace(/,/g, '')); if (v > 0) S.d.prices[t.dataset.price] = { price: v, at: today() }; else delete S.d.prices[t.dataset.price]; save(); render(); toast('현재가를 넣었어요'); }
  else if (t.dataset.bal) { const a = S.d.accounts.find(x => x.id === t.dataset.bal); if (a) { a.balance = parseAmt(t.value); a.at = today(); save(); render(); toast('잔액을 고쳤어요'); } }
  else if (t.id === 'up-file') { const f = t.files && t.files[0]; if (f) await handleUpload(f); }
  else if (t.id === 'restore-file') { const f = t.files && t.files[0]; if (f) await doRestore(f); }
});
document.addEventListener('input', e => { if (e.target.id === 'sms-text') S.smsText = e.target.value; });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS.includes(h) && h !== S.tab) { S.tab = h; S.edit = null; render(); window.scrollTo(0, 0); } });
function init() {
  loadWS(LS.get(K('ws'), 'sample') === 'mine' ? 'mine' : 'sample');
  const h = location.hash.slice(1); S.tab = VIEWS.includes(h) ? h : 'home';
  render(); maybeAutoFx();
}
if (!window.__MOA_TEST__) init();
</script>
