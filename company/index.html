<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>돈흐름 장부</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 장부(회계 장부) 작업대 — 상단 고정 바 + 탭, 1200px 본문 열, 표는 제목 아래 이중선으로 장부처럼 */
:root{
  --bg:#F1F4F1; --surface:#FFFFFF; --sunk:#E7ECE8; --ink:#14231F; --ink-2:#45554F; --ink-3:#71807A;
  --line:#D4DBD6; --line-2:#B6C2BC;
  --accent:#0D6A52; --accent-ink:#FFFFFF; --accent-soft:#DCEEE6; --bar:#2C8769;
  --ok:#1C7448; --ok-soft:#E1F1E7; --warn:#9A6210; --warn-soft:#FAEFD9; --serious:#B5511A; --serious-soft:#FBE8DB; --crit:#B42318; --crit-soft:#FBE6E3;
  --f-display:"Hahmlet","Noto Serif KR","AppleMyungjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151D1A; --sunk:#1D2723; --ink:#E5ECE8; --ink-2:#A8B6B0; --ink-3:#7D8C86;
  --line:#28342F; --line-2:#3A4842;
  --accent:#4CC096; --accent-ink:#04241A; --accent-soft:#173A2E; --bar:#45B08B;
  --ok:#5BC98A; --ok-soft:#163323; --warn:#E3AC4E; --warn-soft:#3A2C12; --serious:#EC8E55; --serious-soft:#3B2216; --crit:#F2766B; --crit-soft:#3D1A17;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --sunk:#1D2723; --ink:#E5ECE8; --ink-2:#A8B6B0; --ink-3:#7D8C86;
  --line:#28342F; --line-2:#3A4842;
  --accent:#4CC096; --accent-ink:#04241A; --accent-soft:#173A2E; --bar:#45B08B;
  --ok:#5BC98A; --ok-soft:#163323; --warn:#E3AC4E; --warn-soft:#3A2C12; --serious:#EC8E55; --serious-soft:#3B2216; --crit:#F2766B; --crit-soft:#3D1A17;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.015em;line-height:1.25}
h2{font-size:15px;font-weight:600;letter-spacing:-.005em}
p{margin:0}
.meta{color:var(--ink-3);font-size:12.5px}
small{font-size:11.5px;color:var(--ink-3);font-weight:400}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}

/* 상단 바 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:12px 6px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.mark{width:22px;height:24px;border:2px solid var(--accent);border-radius:3px;background:
  linear-gradient(var(--accent),var(--accent)) 3px 7px/12px 2px no-repeat,
  linear-gradient(var(--accent),var(--accent)) 3px 11px/12px 2px no-repeat,
  linear-gradient(var(--accent),var(--accent)) 3px 16px/8px 2px no-repeat}
.co{display:flex;align-items:center;gap:8px;min-width:0;color:var(--ink-2)}
.co-name{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.bar-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
.mon{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:6px;padding:9px 12px 10px;border-bottom:2px solid transparent;color:var(--ink-2);text-decoration:none;white-space:nowrap;font-weight:500}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-color:var(--accent);font-weight:600}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}

main.wrap{padding-block:22px 72px}
.view{display:grid;gap:16px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-bottom:4px}
.page-head .meta{margin-top:4px;font-size:13px}

/* 공통 컴포넌트 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0;scroll-margin-top:130px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin-bottom:12px}
.card-head h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.stack{display:grid;gap:16px;align-content:start}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link-btn{background:none;border:0;padding:0;font:inherit;font-size:13px;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.danger-text{color:var(--crit)}
:where(button,a,select,input,summary,label.btn):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:6px 10px;min-width:0;max-width:100%}
input[type="checkbox"]{width:16px;height:16px;accent-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;padding:2px;background:var(--sunk)}
.seg button{border:0;background:none;padding:5px 11px;border-radius:5px;font:inherit;font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgb(0 0 0 / .1)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:1.6;white-space:nowrap;border:0;font-family:var(--f-body)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.serious{background:var(--serious-soft);color:var(--serious)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.muted{background:var(--sunk);color:var(--ink-2)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
button.chip{cursor:pointer}
.src{display:block;font-size:11px;color:var(--ink-3)}
.note{padding:10px 14px;border-radius:var(--r);background:var(--sunk);color:var(--ink-2);font-size:13px}
.warn-note{background:var(--warn-soft);color:var(--ink)}
.crit-note{background:var(--crit-soft);color:var(--ink)}
.foot{margin-top:12px}
.up-good{color:var(--ok);font-weight:600}
.up-bad{color:var(--crit);font-weight:600}
.neg{color:var(--crit)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 표: 장부식 이중선 */
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;font-weight:600;color:var(--ink-2);font-size:12px;padding:7px 8px;border-bottom:3px double var(--line-2);white-space:nowrap;letter-spacing:.01em}
td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th.num,td.num{text-align:right}
tbody tr:hover td{background:color-mix(in srgb, var(--sunk) 55%, transparent)}
tfoot td{font-weight:600;border-top:1px solid var(--ink-3);border-bottom:0;padding-top:9px}
tr.jstart td{border-top:1px solid var(--line-2)}
td select{padding:4px 6px;font-size:12.5px;max-width:170px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpi{display:block;padding:15px 18px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);color:inherit;text-decoration:none;min-width:0}
a.kpi:hover{border-color:var(--accent)}
.kpi .lab{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);letter-spacing:.02em;min-height:21px}
.kpi .val{font-family:var(--f-display);font-size:27px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.3}
.kpi .sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}

/* 구성 막대 */
.comp{display:grid;gap:2px}
.crow{display:grid;grid-template-columns:minmax(80px,128px) minmax(40px,1fr) auto 40px;gap:10px;align-items:center;width:100%;padding:6px 8px;border-radius:5px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.crow:hover{background:var(--sunk)}
.crow[aria-pressed="true"]{background:var(--accent-soft)}
.cname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctrack{height:10px;display:block}
.cbar{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.crow.need .cbar{background:repeating-linear-gradient(135deg,var(--warn) 0 4px,color-mix(in srgb,var(--warn) 55%,transparent) 4px 7px)}
.crow.need .cname{color:var(--warn);font-weight:600}
.cval{text-align:right;font-size:12.5px}
.cpct{text-align:right;color:var(--ink-3);font-size:12px}

/* 미수 나이 */
.big{font-family:var(--f-display);font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.25}
.lab{font-size:12.5px;color:var(--ink-2)}
.aging{display:grid;gap:4px;margin-top:14px}
.arow{display:grid;grid-template-columns:96px minmax(40px,1fr) auto 36px;gap:10px;align-items:center;padding:5px 0}
.aname{display:flex;align-items:center;gap:7px;font-size:13px}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block}
.b1{background:var(--ink-3)} .b2{background:var(--warn)} .b3{background:var(--serious)} .b4{background:var(--crit)}

/* 차트 */
.chart{position:relative;min-height:220px}
.chart svg{display:block;max-width:100%}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--ink-3);font-size:11px;font-family:var(--f-body)}
.chart .area{fill:var(--accent-soft)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.chart .end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .xh{stroke:var(--ink-3);stroke-dasharray:3 3}
.chart .hd{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:6px 10px;font-size:12px;box-shadow:0 6px 16px rgb(0 0 0 / .12);white-space:nowrap;z-index:2}

/* 분류 검토 */
.review-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.rv{display:grid;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.rv:first-of-type{border-top:0;padding-top:4px}
.rv-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rv-amt{margin-left:auto;font-weight:500}
.rv-name{font-size:14.5px}
.rv-ctl{display:flex;gap:8px 14px;flex-wrap:wrap}
.rv-ctl label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer}
.ai-note{font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.done{padding:18px 0;display:grid;gap:4px}

/* 자금일보 */
.daynav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px}
.daynav .spacer{flex:1}

/* 데이터 */
.data-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:14px 0}
.form label,.form-1{display:grid;gap:4px;font-size:12.5px;color:var(--ink-2)}
.form-1{margin:10px 0}
.filebox input{padding:5px}
.preview{display:grid;gap:8px;padding:14px;border:1px dashed var(--line-2);border-radius:var(--r);margin-top:4px}
.help{margin-top:16px;font-size:13px;color:var(--ink-2)}
.help summary{cursor:pointer;color:var(--accent);font-weight:500}
.help ul{margin:8px 0;padding-left:18px;display:grid;gap:4px}
.confirm{display:grid;gap:10px;padding:12px;border-radius:var(--r);background:var(--crit-soft);margin-top:12px}
.card > p + p{margin-top:8px}
.card > h2 + p{margin-top:8px}
.empty{display:grid;gap:10px;justify-items:start;padding:28px 24px}
.empty p{max-width:60ch;color:var(--ink-2)}

/* 발행 창 */
dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--surface);color:var(--ink);width:min(460px,calc(100vw - 32px))}
dialog::backdrop{background:rgb(0 0 0 / .38)}
dialog form{display:grid;gap:12px;padding:20px}
dialog label{display:grid;gap:4px;font-size:12.5px;color:var(--ink-2)}
.calc{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.calc b{color:var(--ink)}
.err{color:var(--crit);font-size:13px;min-height:1em}

#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1}

@media (max-width:900px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .review-grid,.data-grid{grid-template-columns:1fr} }
@media (max-width:760px){ .grid2{grid-template-columns:1fr} }
@media (max-width:520px){
  .kpis{grid-template-columns:1fr}
  h1{font-size:22px}
  .kpi .val{font-size:24px}
  .crow{grid-template-columns:minmax(0,1fr) auto 36px;row-gap:4px}
  .crow .ctrack{grid-column:1 / -1;grid-row:2}
  .arow{grid-template-columns:88px minmax(30px,1fr) auto}
  .arow > :last-child{display:none}
  .bar-tools{margin-left:0;width:100%}
}
.upd{display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink)}
.upd p{margin:4px 0 0;font-size:13px;color:var(--ink-2)}
.upd-btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;scroll-behavior:auto!important} }
</style>

<header class="bar">
  <div class="wrap">
    <div class="bar-row">
      <div class="brand"><span class="mark" aria-hidden="true"></span>돈흐름 장부</div>
      <div class="co" id="co"></div>
      <div class="bar-tools">
        <div class="seg" role="group" aria-label="볼 데이터 고르기">
          <button type="button" data-ws="sample" aria-pressed="true">샘플 회사</button>
          <button type="button" data-ws="mine" aria-pressed="false">우리 회사</button>
        </div>
        <label class="mon" for="month">기간 <select id="month"></select></label>
      </div>
    </div>
    <nav class="tabs" aria-label="화면">
      <a class="tab" href="#dashboard" data-v="dashboard">대시보드</a>
      <a class="tab" href="#receivables" data-v="receivables">받을 돈</a>
      <a class="tab" href="#review" data-v="review">분류 검토 <span class="badge" id="badge-review" hidden></span></a>
      <a class="tab" href="#daily" data-v="daily">자금일보 · 전표</a>
      <a class="tab" href="#data" data-v="data">데이터 연결</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-dashboard"></section>
  <section class="view" id="v-receivables" hidden></section>
  <section class="view" id="v-review" hidden></section>
  <section class="view" id="v-daily" hidden></section>
  <section class="view" id="v-data" hidden></section>
</main>

<dialog id="dlg-inv" aria-labelledby="inv-title">
  <form id="inv-form" novalidate>
    <h2 id="inv-title">세금계산서 발행</h2>
    <p class="note">연습용 발행이에요. 국세청에는 보내지 않고 이 장부에만 기록돼요. 실제 발행은 발행 API(영상의 볼타 같은 서비스)를 연결해야 해요.</p>
    <label>거래처 <input id="inv-partner" list="cust-list" autocomplete="off" placeholder="예: (주)미래패키징"></label>
    <datalist id="cust-list"></datalist>
    <label>품목 <input id="inv-item" autocomplete="off" placeholder="예: 베어링 하우징"></label>
    <label>공급가액 (원) <input id="inv-supply" inputmode="numeric" autocomplete="off" placeholder="예: 25000000"></label>
    <div class="calc">세액 10% <b id="inv-vat">0원</b> 합계 <b id="inv-total">0원</b></div>
    <label>작성일 <input type="date" id="inv-date"></label>
    <p class="err" id="inv-err" aria-live="polite"></p>
    <div class="btns"><button type="submit" class="btn primary">발행하기</button><button type="button" class="btn" id="inv-cancel">닫기</button></div>
  </form>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
'use strict';
/* ───────── 기본 도구 ───────── */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const p2 = n => String(n).padStart(2, '0');
const p4 = n => String(n).padStart(4, '0');
const won = n => Math.round(n || 0).toLocaleString('ko-KR');
const num = n => won(n);
const sum = (a, k) => a.reduce((s, x) => s + (Number(x[k]) || 0), 0);
const byDate = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0;

function niceTicks(mn, mx, n) {
  if (mn === mx) { mn -= 1e6; mx += 1e6; }
  const raw = (mx - mn) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const st = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= raw);
  const a = Math.floor(mn / st) * st, b = Math.ceil(mx / st) * st, out = [];
  for (let v = a; v <= b + st / 2; v += st) out.push(v);
  return out;
}
function drawBalChart(pts) {
  const box = $('#bal-chart'); if (!box) return;
  if (!pts.length || !S.data.accounts.length) { box.innerHTML = '<p class="meta">통장 거래가 없어요</p>'; return; }
  const W = Math.max(260, Math.floor(box.clientWidth || 520)), H = 220, L = 58, Rr = 14, T = 12, B = 28;
  const vals = pts.map(p => p.v), ticks = niceTicks(Math.min(...vals), Math.max(...vals), 4), y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const step = (W - L - Rr) / Math.max(1, pts.length - 1);
  const x = i => L + (pts.length === 1 ? (W - L - Rr) / 2 : i * step);
  const y = v => T + (H - T - B) * (1 - (v - y0) / ((y1 - y0) || 1));
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const area = line + `L${x(pts.length - 1).toFixed(1)},${y(y0).toFixed(1)}L${x(0).toFixed(1)},${y(y0).toFixed(1)}Z`;
  const grid = ticks.map(t => `<line x1="${L}" x2="${W - Rr}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" class="g"/><text x="${L - 8}" y="${(y(t) + 4).toFixed(1)}" class="ax" text-anchor="end">${short(t)}</text>`).join('');
  const xl = pts.map((p, i) => ({ p, i })).filter(({ p }) => [1, 8, 15, 22, 29].includes(Number(p.d.slice(8)))).map(({ p, i }) => `<text x="${x(i).toFixed(1)}" y="${H - 8}" class="ax" text-anchor="middle">${Number(p.d.slice(8))}일</text>`).join('');
  const last = pts.length - 1;
  box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${fmtYM(S.month)} 전체 통장 잔액 흐름, 마지막 날 ${man(pts[last].v)}">${grid}<path d="${area}" class="area"/><path d="${line}" class="ln"/><circle cx="${x(last).toFixed(1)}" cy="${y(pts[last].v).toFixed(1)}" r="4" class="end"/>${xl}<line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/><circle class="hd" r="4" cx="0" cy="0" visibility="hidden"/><rect x="${L - 6}" y="0" width="${W - L - Rr + 12}" height="${H}" fill="transparent"/></svg><div class="tip" hidden></div>`;
  const svg = box.querySelector('svg'), tip = box.querySelector('.tip'), xh = svg.querySelector('.xh'), hd = svg.querySelector('.hd');
  svg.addEventListener('pointermove', ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(last, Math.round((px - L) / step))), cx = x(i), cy = y(pts[i].v);
    xh.setAttribute('x1', cx); xh.setAttribute('x2', cx); xh.setAttribute('visibility', 'visible');
    hd.setAttribute('cx', cx); hd.setAttribute('cy', cy); hd.setAttribute('visibility', 'visible');
    tip.hidden = false; tip.innerHTML = `<b>${fmtD(pts[i].d)}</b><br><span class="num">${won(pts[i].v)}원</span>`;
    const tw = tip.offsetWidth || 140, sx = r.width / W;
    tip.style.left = Math.min(Math.max(0, cx * sx - tw / 2), r.width - tw) + 'px';
    tip.style.top = Math.max(0, cy * sx - 58) + 'px';
  });
  svg.addEventListener('pointerleave', () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); hd.setAttribute('visibility', 'hidden'); });
}

  const partner = $('#inv-partner').value.trim(), item = $('#inv-item').value.trim(), supply = Math.round(parseAmt($('#inv-supply').value)), date = $('#inv-date').value;
  if (!partner || !item || !(supply > 0) || !date) { $('#inv-err').textContent = '거래처, 품목, 공급가액, 작성일을 모두 넣어 주세요'; return; }
  if (S.ws === 'sample' && date > compute().asOf) { $('#inv-err').textContent = `샘플 회사는 ${compute().asOf}까지만 기록할 수 있어요`; return; }
  const vat = Math.round(supply * .1);
  S.data.inv.push({ id: uid('S'), type: 'S', date, partner, item, supply, vat, total: supply + vat, mine: true });
  saveData(); bump();
  const ms = compute().months; if (!ms.includes(S.month) && ms.includes(date.slice(0, 7))) S.month = date.slice(0, 7);
  $('#dlg-inv').close(); toast('발행했어요 · 받을 돈에 추가됐어요'); render();
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS.includes(h) && h !== S.tab) { S.tab = h; render(); window.scrollTo(0, 0); } });
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (S.tab === 'dashboard' && $('#bal-chart')) drawBalChart(balSeries(S.month)); }, 150); });
function init() {

/* ───────── 새 버전 알림 (내려받은 파일에서만, 12시간에 한 번 확인) ───────── */
const APP_VERSION = 'v1.8';
(function updateCheck(fileName, keyPrefix) {
  if (location.protocol !== 'file:' || APP_VERSION === 'dev') return;
  const LSK = keyPrefix + 'update', SITE = 'https://converseddululu.github.io/moa-money/';
  const DL = 'https://github.com/ConverseDDULULU/moa-money/releases/latest/download/' + fileName;
  let st = {}; try { st = JSON.parse(localStorage.getItem(LSK) || '{}') || {}; } catch { st = {}; }
  const keep = () => { try { localStorage.setItem(LSK, JSON.stringify(st)); } catch {} };
  const nums = s => (String(s).match(/\d+/g) || []).map(Number);
  const newer = (a, b) => { const x = nums(a), y = nums(b); for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d > 0; } return false; };
  let shown = false;
  function show(tag) {
    if (shown || st.dismissed === tag || !newer(tag, APP_VERSION)) return;
    const main = document.querySelector('main'); if (!main) return;
    shown = true;
    const box = document.createElement('div');
    box.className = 'upd'; box.setAttribute('role', 'status');
    box.innerHTML = `<div><b>새 버전이 나왔어요 (${String(tag).replace(/[<>&"]/g, '')})</b><p>지금 쓰는 파일은 ${APP_VERSION}이에요. 새 파일을 받아서 이 파일 대신 열면 돼요. 같은 브라우저로 열면 기록은 그대로예요. 걱정되면 먼저 백업 파일을 받아 두세요.</p></div>
      <div class="upd-btns"><a class="btn primary" href="${DL}">새 파일 받기</a><a class="btn" href="${SITE}" target="_blank" rel="noopener">사이트로 열기</a><button type="button" class="link-btn" data-upd-later>나중에</button></div>`;
    main.prepend(box);
    const later = box.querySelector('[data-upd-later]');
    if (later) later.addEventListener('click', () => { st.dismissed = tag; keep(); box.remove(); });
  }
  if (st.latest) show(st.latest);
  if (st.at && Date.now() - st.at < 12 * 3600 * 1000) return;
  fetch('https://api.github.com/repos/ConverseDDULULU/moa-money/releases/latest', { headers: { Accept: 'application/vnd.github+json' } })
    .then(r => (r.ok ? r.json() : null))
    .then(j => { if (!j || !j.tag_name) return; st.latest = String(j.tag_name); st.at = Date.now(); keep(); show(st.latest); })
    .catch(() => {});
})('money-ledger.html', 'money-ledger.v1.');
if (!window.__LEDGER_TEST__) init();
